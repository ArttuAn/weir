<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 498" width="980" height="498" role="img"><title>appointments vs HTTP 429</title><text x="24" y="40" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B2530" text-anchor="start">A refusal that carries an appointment, not an apology</text><text x="24" y="64" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B7180" text-anchor="start">Retry storms exist because a rejection carries no scheduling information, so every caller has to guess when to come back.</text><text x="24" y="101.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DC2626" text-anchor="start">HTTP 429</text><text x="104" y="101.6" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B7180" text-anchor="start">“try again later” — everyone guesses, and they collide</text><rect x="102" y="199.6" width="38" height="14.4" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="148" y="149.2" width="38" height="64.8" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="148" y="149.2" width="38" height="36.0" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="194" y="185.2" width="38" height="28.8" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="240" y="206.8" width="38" height="7.2" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="286" y="163.6" width="38" height="50.4" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="286" y="163.6" width="38" height="21.6" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="332" y="127.6" width="38" height="86.4" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="332" y="127.6" width="38" height="57.6" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="378" y="192.4" width="38" height="21.6" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="424" y="206.8" width="38" height="7.2" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="470" y="156.4" width="38" height="57.6" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="470" y="156.4" width="38" height="28.8" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="516" y="134.8" width="38" height="79.2" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="516" y="134.8" width="38" height="50.4" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="562" y="199.6" width="38" height="14.4" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="654" y="170.8" width="38" height="43.2" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="654" y="170.8" width="38" height="14.4" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="700" y="142.0" width="38" height="72.0" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="700" y="142.0" width="38" height="43.2" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><rect x="746" y="192.4" width="38" height="21.6" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="792" y="206.8" width="38" height="7.2" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="838" y="149.2" width="38" height="64.8" rx="3" fill="#5B7180" stroke="none" stroke-width="1" opacity="0.9"/><rect x="838" y="149.2" width="38" height="36.0" rx="3" fill="#DC2626" stroke="none" stroke-width="1"/><line x1="46" y1="185.2" x2="884" y2="185.2" stroke="#0B2530" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.75"/><line x1="46" y1="214" x2="884" y2="214" stroke="#C6D5DB" stroke-width="1.5" stroke-linecap="round"/><text x="40" y="189.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0B2530" text-anchor="end" opacity="0.8">cap</text><text x="24" y="339.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0F766E" text-anchor="start">weir</text><text x="104" y="339.2" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B7180" text-anchor="start">a signed slot each — arriving early costs credits and cannot move it</text><rect x="56" y="372.4" width="38" height="21.6" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="102" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="148" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="194" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="240" y="372.4" width="38" height="21.6" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="286" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="332" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="378" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="424" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="470" y="372.4" width="38" height="21.6" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="516" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="562" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="608" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="654" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="700" y="372.4" width="38" height="21.6" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="746" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="792" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><rect x="838" y="365.2" width="38" height="28.8" rx="3" fill="#0D9488" stroke="none" stroke-width="1" opacity="0.9"/><line x1="46" y1="365.2" x2="884" y2="365.2" stroke="#0B2530" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.75"/><line x1="46" y1="394" x2="884" y2="394" stroke="#C6D5DB" stroke-width="1.5" stroke-linecap="round"/><text x="40" y="369.2" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#0B2530" text-anchor="end" opacity="0.8">cap</text><text x="24" y="434" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B7180" text-anchor="start">arrivals per interval  ·  dashed line is what the upstream can actually serve</text><line x1="16" y1="452" x2="964" y2="452" stroke="#C6D5DB" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/><text x="24" y="478" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B7180" text-anchor="start">Shape is schematic. The measured figure, from the same 400 callers in `weir demo storm`: 5,942 attempts against a classic gateway, 2,740 against weir.</text></svg>