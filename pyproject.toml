[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weir"
version = "0.1.0"
description = "A router for an internet whose traffic is agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arttu Antikainen" }]
keywords = ["router", "agents", "congestion-control", "routing", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
weir = "weir.cli:main"

[tool.setuptools.packages.find]
include = ["weir*"]
